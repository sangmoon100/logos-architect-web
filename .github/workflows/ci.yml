# Logos Architect CI/CD 인프라 최적화 프로토콜
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 현재 활성화된 Active LTS 노드 버전 규격 반영
        node-version: [20.x, 22.x]

    steps:
    - name: 1. 레포지토리 소스 코드 체크아웃
      uses: actions/checkout@v4

    - name: 2. 가상 머신 내 Node.js ${{ matrix.node-version }} 인프라 세팅
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        # 캐시 의존성 경로를 클라이언트 기준으로 명시하여 속도 최적화
        cache-dependency-path: './client/package.json'

    - name: 3. 프론트엔드(Client) 의존성 설치 및 프로덕션 빌드 검증
      run: |
        cd client
        npm ci
        npm run build

    - name: 4. 백엔드(Server) 의존성 설치 및 구동 정합성 검증
      run: |
        cd server
        npm ci
    
    - name: Run Jest with coverage
      run: npm test -- --coverage

    - name: Upload results to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
